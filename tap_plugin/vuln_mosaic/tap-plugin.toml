manifest_version = "0"
plugin_version = "0.5.0" # x-release-please-version
requires_tap = ">=0.3.0"
slug = "vuln_mosaic"
name = "TAP Vuln Mosaic"
description = "Local copies of public vulnerability data — CVE records, CISA KEV, EPSS, NVD and OSV — kept as files and SQLite stores so a running instance makes no lookups at use time. Collects only; it never scans, matches or writes findings."

# No other plugin is imported (req-vuln-mosaic-wanted-4): consumers write a plain file or the
# collector reads vulnerability ids off the grid, and a read function serves them. The one
# vocabulary reference is an entity-type slug held as a setting string (grid.vulnerability_types,
# default compliance_core__compliance_vulnerability, req-vuln-mosaic-wanted-7); a type that is not
# installed is named in the run record and skipped, so this is not a dependency.
depends_on = []

# The author's DECLARED crypto posture (req-vuln-mosaic-fips). HTTPS and digests use the standard
# library, which resolves to the image's OpenSSL. The `git` subprocess does its own TLS through
# libcurl: observed 2026-10-19 in the tap-web image, git 2.56.0 reports "OpenSSL: OpenSSL 4.0.3" and
# its libcurl.so.4 links libssl.so.4 / libcrypto.so.4 (no GnuTLS, mbedTLS, NSS, wolfSSL or
# BoringSSL), the same system OpenSSL family as the image's CPython. The test
# test_git_links_only_the_system_openssl keeps that observation true.
[fips]
status = "compatible"

[[boot.records]]
name = "ci"
description = "RESERVED NAME (req-boot-bootstrap-ci-record): the stack this plugin's own tests run in — depends_on closure (empty) + self, offline, credential-free. The consumer flips self to editable."
sha256 = "b40236b91414de5e95b2991dd95aea8ca57efd15276356ba24efe1ba4ea132be"

# Seeded data this plugin ships: the schedule that fires the refresh collector. The
# schedule-grift-targets guard verifies the SCHEDULED_TARGET edge resolves to the registered collector.
[grift]
schedule = "grift/schedule.grift.json"
